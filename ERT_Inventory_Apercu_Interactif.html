let memoryStore={}; function get(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return memoryStore[k]??def}}function save(k,v){memoryStore[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let history=get('ertdemo_history',[]),issues=get('ertdemo_issues',[]),draft=get('ertdemo_draft',null),page='home',expanded='cabine';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s){let d=new Date(s);return isNaN(d)?'—':d.toLocaleString('fr-FR')}
function setPage(p){page=p;render();window.scrollTo(0,0)}function modal(body){$('modal').style.display='grid';$('modal').className='overlay';$('modal').innerHTML='<div class="modal">'+body+'</div>'}function closeModal(){$('modal').style.display='none';$('modal').innerHTML=''}
function render(){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('active',['home','issues','history','admin'][i]===page));let m=$('main');if(page==='home')m.innerHTML=home();if(page==='survey')m.innerHTML=survey();if(page==='issues')m.innerHTML=issuesPage();if(page==='history')m.innerHTML=historyPage();if(page==='admin')m.innerHTML=adminPage()}
function home(){let open=issues.filter(i=>i.status!=='resolved').length;return `<div class="hero"><div class="tag">CONTRÔLE DU PARC</div><h1>Prêts à intervenir.</h1><p>Inventaires rapides, anomalies précises.</p><div class="stats"><div class="stat">🚒<strong>7</strong><span>véhicules</span></div><div class="stat">✔<strong>${history.length}</strong><span>contrôles VSAV</span></div><div class="stat">⚠<strong>${open}</strong><span>anomalies</span></div></div></div>${draft?`<div class="alert">Contrôle en cours : ${esc(draft.agent)} • ${esc(draft.mode)}. <a href="#" onclick="setPage('survey');return false">Reprendre</a></div>`:''}<h2>Choisir un véhicule</h2><div class="grid">${CATALOG.vehicles.map(v=>`<div class="vehicle ${v.enabled?'':'disabled'}" onclick="choose('${v.id}')"><div class="icon">${v.id==='VSAV'?'🚑':'🚒'}</div><div class="info"><b>${esc(v.name)}</b><small>${v.enabled?'Contrôle disponible':'Intégration prévue'}</small></div><span class="pill ${v.enabled?'':'wait'}">${v.enabled?'PRÊT':'À VENIR'}</span></div>`).join('')}</div><p class="caption">APERÇU HTML LOCAL • Pas d'envoi Outlook automatique ni de synchronisation. Seul le VSAV est fonctionnel.</p>`}
function choose(id){if(id!=='VSAV'){alert('Ce véhicule sera intégré après validation du VSAV.');return}if(draft){setPage('survey');return}modal(`<h2>🚑 Nouveau contrôle VSAV</h2><label>Nom et prénom de l’agent</label><input class="input" id="agent" placeholder="Ex. Julien Dupont" value="${esc(get('ertdemo_agent',''))}"><label>Type de contrôle</label><select class="input" id="mode"><option value="INVENTAIRE">Inventaire complet</option><option value="VERIFICATION">Vérification</option></select><div style="display:flex;gap:10px"><button class="button light" onclick="closeModal()">Annuler</button><button class="button" onclick="start()">Démarrer</button></div>`)}
function start(){let a=$('agent').value.trim(),mode=$('mode').value;if(a.length<3){alert('Indique le nom et le prénom de l’agent.');return}save('ertdemo_agent',a);draft={id:Date.now().toString(36),agent:a,mode,vehicle:'VSAV',started:new Date().toISOString(),fuel:null,dashboard:null,dashboardNote:'',body:null,bodyNote:'',o2:null,co:null,coNote:'',items:{}};save('ertdemo_draft',draft);closeModal();setPage('survey')}
function setField(k,v){draft[k]=v;save('ertdemo_draft',draft);renderSurveyKeep()}function setText(k,v){draft[k]=v;save('ertdemo_draft',draft)}function renderSurveyKeep(){render();let target=document.querySelector(`[data-section="${expanded}"]`);if(target)target.open=true}
function opt(key,arr){return `<div class="opts">${arr.map(([v,l])=>`<button class="${draft[key]===v?'sel':''}" onclick="setField('${key}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${esc(l)}</button>`).join('')}</div>`}
function section(s){let items=s.items.filter(i=>i.active!==false),done=items.filter(i=>draft.items[i.id]).length,bad=items.filter(i=>draft.items[i.id]?.status==='anomaly').length;return `<details class="sec" data-section="${s.id}" ${expanded===s.id?'open':''} ontoggle="if(this.open)expanded='${s.id}'"><summary><span>▣ ${esc(s.title)}</span><span class="pill ${bad?'red':''}">${done}/${items.length}${bad?' • '+bad+' ⚠':''}</span></summary><div class="inside"><button class="button green" style="margin:3px 0 12px;padding:9px 13px" onclick="allOk('${s.id}')">✓ NOTHING TO REPORT</button>${items.map(i=>{let a=draft.items[i.id],isOk=a?.status==='ok',isBad=a?.status==='anomaly';return `<div class="line"><div class="name"><b>${esc(i.label)}</b><div class="status" style="color:${isBad?'#e15256':isOk?'#168a70':'#8693a3'}">${isBad?esc(a.type+' • '+a.note):isOk?'Conforme':'À vérifier'}</div></div><button class="${isOk?'good':''}" title="Conforme" onclick="mark('${i.id}')">✔</button><button class="${isBad?'bad':''}" title="Anomalie" onclick="problem('${i.id}')">⚠</button></div>`}).join('')}</div></details>`}
function survey(){let items=CATALOG.sections.flatMap(s=>s.items).filter(i=>i.active!==false),count=items.filter(i=>draft.items[i.id]).length;return `<button class="back" onclick="setPage('home')">← Enregistrer et quitter</button><h1>🚑 VSAV • ${draft.mode==='INVENTAIRE'?'Inventaire':'Vérification'}</h1><div class="small">👨‍🚒 ${esc(draft.agent)} · Sauvegarde locale automatique</div>${draft.mode==='INVENTAIRE'?`<div class="progress"><b style="width:${count/items.length*100}%"></b></div><div class="small">${count} / ${items.length} lignes vérifiées</div>`:''}<div class="card" style="margin-top:17px"><h2 style="margin:0 0 16px">Vérifications générales</h2><b>Niveau de carburant</b>${opt('fuel',[['1/4','¼'],['2/4','½'],['3/4','¾'],['4/4','Plein']])}<b>Voyant / information au tableau de bord</b>${opt('dashboard',[['ok','Aucun'],['alert','Voyant présent']])}${draft.dashboard==='alert'?`<input class="input" placeholder="Préciser le(s) voyant(s)" value="${esc(draft.dashboardNote)}" oninput="setText('dashboardNote',this.value)">`:''}<b>Carrosserie et signalisation</b>${opt('body',[['ok','Conforme'],['alert','Anomalie']])}${draft.body==='alert'?`<textarea class="input" placeholder="Décrire la zone et le défaut" oninput="setText('bodyNote',this.value)">${esc(draft.bodyNote)}</textarea>`:''}${draft.mode==='INVENTAIRE'?`<b>Sac PS • Bouteille O₂ B5 : <span style="color:var(--green)">${draft.o2===null?'Non renseigné':draft.o2+'/10'}</span></b><input style="width:100%;accent-color:var(--green)" type="range" min="0" max="10" value="${draft.o2??0}" oninput="setField('o2',Number(this.value))"><br><b>Détecteur CO présent et fonctionnel ?</b><p class="small">Prochain contrôle indiqué : novembre 2026.</p>${opt('co',[['ok','Oui'],['alert','Non']])}${draft.co==='alert'?`<input class="input" placeholder="Absent ou autre problème ?" value="${esc(draft.coNote)}" oninput="setText('coNote',this.value)">`:''}`:''}</div>${draft.mode==='INVENTAIRE'?`<h2>Inventaire par compartiment</h2>${CATALOG.sections.map(section).join('')}`:''}<div class="endbar"><button class="button light" onclick="setPage('home')">Sauver et quitter</button><button class="button red" onclick="finish()">Terminer le contrôle →</button></div>`}
function mark(id){draft.items[id]={status:'ok'};save('ertdemo_draft',draft);renderSurveyKeep()}
function allOk(id){let s=CATALOG.sections.find(s=>s.id===id),bad=s.items.some(i=>draft.items[i.id]?.status==='anomaly');if(bad&&!confirm('Cette action va remplacer les anomalies saisies dans ce compartiment. Continuer ?'))return;s.items.filter(i=>i.active!==false).forEach(i=>draft.items[i.id]={status:'ok'});save('ertdemo_draft',draft);renderSurveyKeep()}
function problem(id){let entry=CATALOG.sections.flatMap(s=>s.items.map(i=>({section:s.title,...i}))).find(i=>i.id===id),old=draft.items[id]??{};modal(`<h2>⚠ Signaler une anomalie</h2><p><b>${esc(entry.label)}</b><br><span class="muted">${esc(entry.section)}</span></p><label>Type de problème</label><select class="input" id="type">${['Manquant','Défectueux','Périmé','Autre'].map(t=>`<option ${old.type===t?'selected':''}>${t}</option>`).join('')}</select><label>Quantité présente (si connue) • attendu : ${entry.quantity??'non précisé'}</label><input class="input" id="qty" type="number" min="0" value="${esc(old.present??'')}"><label>Observation *</label><textarea class="input" id="obs" rows="4" placeholder="Préciser le défaut et ses conséquences">${esc(old.note??'')}</textarea><label>Photo(s) du matériel (non sauvegardées en démo)</label><input type="file" multiple accept="image/*" class="input" id="pics"><p class="caption">Dans cette démo HTML, les photos ne sont ni conservées ni utilisées ; elles seront gérées par l’application Android.</p><button class="button red" onclick="saveProblem('${id}')">Enregistrer l'anomalie</button> <button class="button light" onclick="closeModal()">Annuler</button>`)}
function saveProblem(id){let note=$('obs').value.trim();if(!note){alert('Renseigne une observation précise.');return}let p=$('qty').value.trim();if(p&&(Number(p)<0||!Number.isInteger(Number(p)))){alert('Quantité invalide.');return}draft.items[id]={status:'anomaly',type:$('type').value,note,present:p===''?null:Number(p)};save('ertdemo_draft',draft);closeModal();renderSurveyKeep()}
function findingsFrom(d){let a=[];CATALOG.sections.forEach(s=>s.items.forEach(i=>{let v=d.items[i.id];if(v?.status==='anomaly')a.push({key:i.id,location:s.title,title:i.label,...v})}));for(let [key,title,kind,note] of [['dashboard','Voyant / tableau de bord','Autre','dashboardNote'],['body','Carrosserie / signalisation','Défectueux','bodyNote'],['co','Détecteur CO','Défectueux / absent','coNote']]){if(d[key]==='alert'&&(key!=='co'||d.mode==='INVENTAIRE'))a.push({key:'CTRL_'+key.toUpperCase(),location:'Vérifications',title,type:kind,note:d[note]??''})}return a}
function finish(){let a=findingsFrom(draft),items=CATALOG.sections.flatMap(s=>s.items).filter(i=>i.active!==false),n=(draft.fuel===null?1:0)+(draft.dashboard===null?1:0)+(draft.body===null?1:0)+(draft.mode==='INVENTAIRE'?items.filter(i=>!draft.items[i.id]).length+(draft.o2===null?1:0)+(draft.co===null?1:0):0);if(n&&!confirm(`${n} point(s) non vérifié(s). Enregistrer quand même comme contrôle PARTIEL ?`))return;let now=new Date().toISOString(),fresh=0;const values=a.map(f=>{let old=issues.find(i=>i.key===f.key&&i.type===f.type&&i.status!=='resolved');if(old){old.confirmations++;old.updated=now;return {...f,existing:true}}issues.unshift({...f,status:'open',vehicle:'VSAV',created:now,updated:now,confirmations:1});fresh++;return {...f,existing:false}});history.unshift({...draft,completed:now,findings:values,missingCount:n,newIssues:fresh});save('ertdemo_issues',issues);save('ertdemo_history',history);draft=null;save('ertdemo_draft',null);setPage('history');alert(`Contrôle enregistré. ${a.length} anomalie(s), dont ${fresh} nouvelle(s). ${n?'Contrôle partiel.':'Contrôle complet.'}`)}
function issuesPage(){let rows=issues.filter(i=>i.status!=='resolved');return `<h1>⚠ Suivi des anomalies</h1><p class="small">Un défaut identique signalé une nouvelle fois reste rattaché au même incident.</p>${rows.length?rows.map(i=>`<div class="listcard"><span class="pill red">${esc(i.status==='in_progress'?'EN COURS':'OUVERTE')}</span><b>${esc(i.title)}</b><p>${esc(i.location)} • ${esc(i.type)}</p><p>${esc(i.note)}</p><span class="small">Depuis ${fmt(i.created)} • ${i.confirmations} constat(s)</span></div>`).join(''):'<div class="card" style="text-align:center;padding:35px">✅ Aucune anomalie ouverte</div>'}`}
function historyPage(){return `<h1>◷ Historique des contrôles</h1><p class="small">Données sauvegardées dans ce navigateur. Aucun rapport n'est transmis automatiquement.</p>${history.length?history.map((h,idx)=>`<div class="listcard"><span class="pill">${esc(h.mode)}</span> <span class="pill ${h.findings.length?'red':''}">${h.findings.length} anomalie(s)</span><b>${esc(h.vehicle)} — ${esc(h.agent)}</b><p class="small">${fmt(h.completed)} • ${h.missingCount} non vérifié(s)</p><button class="button light" onclick="showReport(${idx})">Voir rapport</button></div>`).join(''):'<div class="card" style="text-align:center;padding:35px">Aucun contrôle enregistré</div>'}`}
function showReport(i){let h=history[i];let html=`<h2>Rapport ${esc(h.vehicle)}</h2><p>Agent : ${esc(h.agent)}<br>Date : ${fmt(h.completed)}<br>Opération : ${esc(h.mode)}</p><p><b>${h.findings.length} anomalie(s) — ${h.missingCount} non vérifié(s)</b></p>${h.findings.map((f,j)=>`<div class="listcard"><b>${j+1}. ${esc(f.title)}</b><p>${esc(f.location)} • ${esc(f.type)}<br>${esc(f.note)}</p><span class="small">${f.existing?'Déjà signalée':'Nouvelle'}</span></div>`).join('')}<p class="caption">Pour envoyer un vrai PDF avec ses photos, utiliser la version Android après compilation.</p><button class="button" onclick="window.print()">Imprimer / PDF</button> <button class="button light" onclick="closeModal()">Fermer</button>`;modal(html)}
function adminPage(){return `<h1>⚙ Administration</h1><div class="card"><h2>Code administrateur</h2><p>Dans le projet Flutter, l'administration locale permet de modifier les listes VSAV et de clôturer une anomalie avec un code de démonstration.</p><p>⚠ <b>Pour 27 agents, la sécurité et les droits devront impérativement être gérés côté serveur.</b></p><button class="button light" onclick="alert('À tester dans le projet Android Flutter. Ce prototype HTML n’implémente pas les droits d’accès.')">Aperçu limité</button></div><h2>À intégrer ensuite</h2><div class="card">Synchronisation partagée des contrôles • authentification administrateur côté serveur • rapport automatique Outlook/Power Automate • inventaires des six autres véhicules</div>`}
render();
</script></body></html>
